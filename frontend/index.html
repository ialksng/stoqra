<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/projects/stoqra/favicon.png" />
    <title>Stoqra | Automated Inventory & GST Management</title>

    <!-- PWA & Mobile Web App Manifest -->
    <link rel="manifest" href="/projects/stoqra/manifest.json" />
    <meta name="theme-color" content="#2563eb" />

    <!-- iOS Safari PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Stoqra" />
    <link rel="apple-touch-icon" href="/projects/stoqra/icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/projects/stoqra/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/projects/stoqra/icon-512.png" />

    <!-- Google Identity Services client library -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Service Worker Registration for PWA Installation -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/projects/stoqra/sw.js')
            .then((reg) => console.log('[PWA] Service Worker active, scope:', reg.scope))
            .catch((err) => console.warn('[PWA] Service Worker registration failed:', err));
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
